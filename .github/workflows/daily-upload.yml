name: Daily Upload

on:
  schedule:
    - cron: '50 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual YouTube upload or Drive move)"
        required: false
        type: boolean
        default: false
      max_uploads:
        description: "Max number of videos to upload"
        required: false
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: multipost11-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::ForceIPv4=true --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Runner public IP
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"

      - name: Run Pipeline
        env:
          PYTHONPATH: .
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || github.event.inputs.dry_run || 'false' }}
          MAX_UPLOADS: ${{ inputs.max_uploads || github.event.inputs.max_uploads || '1' }}
        run: python -u src/ci_run.py --config config.json

      - name: Commit state changes
        if: always()
        run: |
          git config user.name "saqibaliofficial1995-crypto"
          git config user.email "saqibaliofficial1995@gmail.com"
          git add state/
          git diff --staged --quiet || (git commit -m "chore: update upload state [skip ci]" && git push)
